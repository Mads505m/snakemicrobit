[package]
name = "firmware"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m-rt = "0.7.5"
embedded-hal = "1.0.0"
panic-halt = "1.0.0"
heapless = "0.8.0"
microbit-v2 = "0.15.1"
tiny-led-matrix = { version = "1.0.2", default-features = false }
usb-device = "0.3.2"
usbd-serial = "0.2.2"
critical-section = { version = "1.2.0", default-features = false, features = ["restore-state-bool"] }
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
rtt-target = { version = "0.3", features = ["cortex-m"] }


[[bin]]
name = "micro"
path = "src/main.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
